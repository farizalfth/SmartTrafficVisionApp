name: smarttrafficapp
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

  # State Management
  provider: ^6.1.2

  # Firebase & Auth
  # Versi terbaru untuk stabilitas
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  firebase_database: ^11.1.0 

  # Maps & Location
  flutter_map: ^7.0.0 # Hati-hati, update ke v7 mungkin butuh sedikit penyesuaian kode map
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # Charts & Data Visualization
  fl_chart: ^0.69.0
  
  # Video Player (Penyebab utama error di Chrome)
  youtube_player_flutter: ^9.0.1

  # Image Picker
  image_picker: ^1.1.2
  
  # Utilities & Storage
  intl: ^0.20.2
  http: ^1.2.2
  csv: ^6.0.0 
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/google_logo.png
    - assets/images/hero.png
    - assets/images/profile.jpg
    # Pastikan nama file di folder assets Anda sudah di-rename jadi ini:
    - assets/datasets/RTA Dataset.csv 
    - assets/datasets/traffic.csv