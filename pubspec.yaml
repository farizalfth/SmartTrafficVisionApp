name: smarttrafficapp
description: "A new Flutter project for Smart Traffic Management."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Firebase & Authentication ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.0 
  firebase_storage: ^12.4.10
  google_sign_in: ^6.2.1

  # --- State Management ---
  provider: ^6.1.2

  # --- UI & Visuals ---
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  fl_chart: ^0.69.0
  
  # --- Multimedia & Images ---
  youtube_player_flutter: ^9.0.1
  image_picker: ^1.1.2

  # --- Maps & Location ---
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # --- Utilities & Data ---
  intl: ^0.20.2
  http: ^1.2.2
  csv: ^6.0.0 
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/google_logo.png
    - assets/images/hero.png
    - assets/images/profile.jpg
    - assets/images/users.jpg
    - assets/datasets/RTA Dataset.csv 
    - assets/datasets/traffic.csv